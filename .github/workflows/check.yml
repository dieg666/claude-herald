name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The types the checks compile against come from this build, so bump it on purpose (2.1.287 is the minimum).
  CLAUDE_CODE_VERSION: 2.1.296
  DISABLE_AUTOUPDATER: '1'

jobs:
  check:
    # Every run waits for a maintainer to approve it in the ci environment, the owner's runs included.
    environment: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Claude Code only writes its types for a trusted directory, so seed the trust and onboarding state that check.sh relies on.
      - name: Trust the workspace
        run: |
          claude --version
          printf '{"hasCompletedOnboarding":true,"projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' "$GITHUB_WORKSPACE" > "$HOME/.claude.json"

      - name: Run the checks
        run: scripts/check.sh
