name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The types the checks compile against come from this build, so bump it on purpose (2.1.287 is the minimum).
  CLAUDE_CODE_VERSION: 2.1.296
  DISABLE_AUTOUPDATER: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Claude Code writes the types for its build only when a trusted directory loads the mod in an interactive session, and it needs no sign-in.
      - name: Write the Claude Code types
        run: |
          claude --version
          printf '{"hasCompletedOnboarding":true,"projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' "$GITHUB_WORKSPACE" > "$HOME/.claude.json"
          types=.claude-plugin/types
          TERM=xterm-256color timeout 120 script -qefc 'claude --plugin-dir .' /dev/null </dev/null >/dev/null 2>&1 &
          session=$!
          for _ in $(seq 1 120); do
            [ -f "$types/claude-code/index.d.ts" ] && [ -f "$types/claude-code-tools/index.d.ts" ] && [ -f "$types/claude-code-mcp/index.d.ts" ] && break
            sleep 1
          done
          sleep 2
          kill "$session" 2>/dev/null || true
          if [ ! -f "$types/claude-code/index.d.ts" ]; then
            echo "::error::Claude Code did not write the types"
            exit 1
          fi

      - name: Run the checks
        run: scripts/check.sh
